[project]
name = "ai-in-he"
version = "0.1.0"
description = "Companion code for the book Artificial Intelligence in Highway Engineering"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "networkx>=3.2",
    "matplotlib>=3.8",
    # Chapters 2 and 3 (Keras models)
    "tensorflow>=2.16",
    # Chapter 4 (perception and ONNX deployment)
    "opencv-python-headless>=4.9",
    "onnxruntime>=1.17",
]

[tool.uv]
package = false
